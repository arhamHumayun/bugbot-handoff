<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Bugbot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Codex Bugbot</h1>
    <p>
      Adds <strong>Open with Codex</strong> next to Cursor Bugbot’s
      Fix in Cursor / Open with Cursor buttons on GitHub, plus an
      <strong>Open with Claude Code</strong> button.
    </p>
    <label>
      Codex destination
      <select id="destination">
        <option value="desktop">Codex Desktop</option>
        <option value="web">Codex Web</option>
        <option value="both">Desktop, then Web</option>
      </select>
    </label>
    <p class="hint">
      Desktop needs the ChatGPT/Codex app so <code>codex://</code> links work.
      Web opens chatgpt.com/codex and fills the composer with the comment.
    </p>
    <p id="status" class="status" hidden></p>
    <script src="../lib/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
